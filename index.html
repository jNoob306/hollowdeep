/* =====================================================================
   UTIL + RNG
   ===================================================================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
// Seeded PRNG: same seed -> same cave.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function h2(ix,iz,s){let h=(Math.imul(ix,374761393)+Math.imul(iz,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
// Smooth value noise, used for rock displacement and floor/ceiling heights.
function vnoise(x,z,s){const ix=Math.floor(x),iz=Math.floor(z);let fx=x-ix,fz=z-iz;fx=fx*fx*(3-2*fx);fz=fz*fz*(3-2*fz);
  return lerp(lerp(h2(ix,iz,s),h2(ix+1,iz,s),fx),lerp(h2(ix,iz+1,s),h2(ix+1,iz+1,s),fx),fz);}

function parseSeed(str){str=(str||'').trim();if(!str)return(Math.random()*4294967296)>>>0;
  if(/^[0-9a-z]{1,7}$/i.test(str)){const n=parseInt(str,36);if(n<=4294967295)return n>>>0;}return hashStr(str);}

const NODE_W=[{stone:4,iron:3,fungus:3},{stone:2,iron:3,fungus:3,silver:3},{iron:2,fungus:2,silver:3,glow:3,amber:0.5},{silver:3,glow:3,amber:3,fungus:1}];
const SPAWN_W=[{crawler:5,swarm:2,spitter:1},{crawler:4,swarm:2,spitter:3,brute:2},{crawler:2,swarm:2,spitter:3,brute:3,elite:1},{crawler:2,swarm:2,spitter:3,brute:3,elite:2}];
const PALETTE=[[0.46,0.40,0.34],[0.36,0.40,0.47],[0.27,0.42,0.40],[0.41,0.30,0.45]];
const FOGC=[0x080706,0x050608,0x040707,0x070508];
function wpick(rng,w){let t=0;for(const k in w)t+=w[k];let r=rng()*t;for(const k in w){r-=w[k];if(r<=0)return k;}return Object.keys(w)[0];}

/* =====================================================================
   LEVEL GENERATION
   Each level is a 2D grid (1 = rock, 0 = open).
   1. random fill  2. cellular-automata smoothing  3. flood-fill regions,
   carve tunnels from big side regions to the main one and fill tiny ones
   4. place start, descent, exit shafts, nodes, chests, enemies by rule.
   ===================================================================== */
function generateLevel(runSeed,depth){
  for(let a=0;a<300;a++){const s=(runSeed+Math.imul(depth,7919)+Math.imul(a,104729))>>>0;const lv=tryGen(mulberry32(s),depth,s);if(lv)return lv;}
  throw new Error('level generation failed');
}
function tryGen(rng,depth,seed){
  const N=GW*GH,I=(x,z)=>z*GW+x,wc=c=>(c+0.5)*CS;
  const border=(x,z)=>x<2||z<2||x>=GW-2||z>=GH-2;
  // Maze: a 10x10 grid of small 2x2 nodes (jittered so walls vary in thickness and
  // corridors kink), linked by a randomized depth-first search. Extra links add loops
  // so the player can circle around pursuers; a few chambers break up the corridors.
  const g=new Uint8Array(N).fill(1);
  const carve=(x,z)=>{if(!border(x,z))g[I(x,z)]=0;};
  const M=10,nx=new Int8Array(M*M),nz=new Int8Array(M*M);
  for(let j=0;j<M;j++)for(let i=0;i<M;i++){const k=j*M+i;nx[k]=2+i*4+(rng()<0.5?1:0);nz[k]=2+j*4+(rng()<0.5?1:0);
    for(let a=0;a<2;a++)for(let b=0;b<2;b++)carve(nx[k]+a,nz[k]+b);}
  const link=(a,b)=>{const x0=nx[a],z0=nz[a],x1=nx[b],z1=nz[b];
    for(let x=Math.min(x0,x1);x<=Math.max(x0,x1)+1;x++){carve(x,z0);carve(x,z0+1);}
    for(let z=Math.min(z0,z1);z<=Math.max(z0,z1)+1;z++){carve(x1,z);carve(x1+1,z);}};
  const seenM=new Uint8Array(M*M),stack=[Math.floor(rng()*M*M)],linked=new Set();seenM[stack[0]]=1;
  while(stack.length){const k=stack[stack.length-1],i=k%M,j=(k/M)|0,opts=[];
    if(i>0&&!seenM[k-1])opts.push(k-1);if(i<M-1&&!seenM[k+1])opts.push(k+1);if(j>0&&!seenM[k-M])opts.push(k-M);if(j<M-1&&!seenM[k+M])opts.push(k+M);
    if(!opts.length){stack.pop();continue;}
    const n=opts[Math.floor(rng()*opts.length)];seenM[n]=1;link(k,n);linked.add(Math.min(k,n)+'_'+Math.max(k,n));stack.push(n);}
  for(let k=0;k<M*M;k++){const i=k%M;for(const n of[i<M-1?k+1:-1,k+M<M*M?k+M:-1]){if(n<0||linked.has(k+'_'+n))continue;if(rng()<0.13)link(k,n);}}
  for(let c=0;c<3;c++){const k=Math.floor(rng()*M*M),cx=nx[k]+1,cz=nz[k]+1,r=2+rng()*1.6;
    for(let z=-4;z<=4;z++)for(let x=-4;x<=4;x++)if(x*x+z*z<=r*r)carve(cx+x,cz+z);}
  // Round off sharp corners without punching through thin walls.
  for(let z=2;z<GH-2;z++)for(let x=2;x<GW-2;x++){const i=I(x,z);if(!g[i])continue;
    let o=0;for(const[dx,dz]of D8)o+=1-g[I(x+dx,z+dz)];
    if(o>=5&&g[I(x-1,z)]+g[I(x+1,z)]>0&&g[I(x,z-1)]+g[I(x,z+1)]>0&&rng()<0.3)g[i]=0;}
  // Guaranteed boss cavern on the final level.
  let boss=null;
  if(depth===MAX_DEPTH){boss={cx:12+Math.floor(rng()*(GW-24)),cz:GH-11};
    for(let z=-6;z<=6;z++)for(let x=-6;x<=6;x++)if(x*x+z*z<=30)carve(boss.cx+x,boss.cz+z);
    boss.x=wc(boss.cx);boss.z=wc(boss.cz);}
  // Flood fill into regions.
  const flood=(from,lab,id)=>{const cells=[from];lab[from]=id;
    for(let q=0;q<cells.length;q++){const c=cells[q],x=c%GW,z=(c/GW)|0;
      for(const[dx,dz]of D4){const j=I(x+dx,z+dz);if(!g[j]&&lab[j]<0){lab[j]=id;cells.push(j);}}}
    return cells;};
  let lab=new Int32Array(N).fill(-1);const regs=[];
  for(let i=0;i<N;i++)if(!g[i]&&lab[i]<0)regs.push(flood(i,lab,regs.length));
  if(!regs.length)return null;
  let main=0;for(let i=1;i<regs.length;i++)if(regs[i].length>regs[main].length)main=i;
  const bossI=boss?I(boss.cx,boss.cz):-1;
  for(let r=0;r<regs.length;r++){if(r===main)continue;const cells=regs[r],hasBoss=boss&&lab[bossI]===r;
    if(cells.length<10&&!hasBoss){for(const c of cells)g[c]=1;continue;}
    // Carve a tunnel from this region to the nearest cell of the main region.
    const a=hasBoss?bossI:cells[Math.floor(rng()*cells.length)],ax=a%GW,az=(a/GW)|0;let best=regs[main][0],bd=1e9;
    for(const m of regs[main]){const d=(m%GW-ax)**2+(((m/GW)|0)-az)**2;if(d<bd){bd=d;best=m;}}
    const bx=best%GW,bz=(best/GW)|0,steps=Math.max(1,Math.max(Math.abs(bx-ax),Math.abs(bz-az))*2);
    for(let s=0;s<=steps;s++){const t=s/steps,x=Math.round(lerp(ax,bx,t)),z=Math.round(lerp(az,bz,t));carve(x,z);carve(x+1,z);carve(x,z+1);carve(x+1,z+1);}}
  lab=new Int32Array(N).fill(-1);const reach=flood(regs[main][0],lab,0);
  for(let i=0;i<N;i++)if(!g[i]&&lab[i]<0)g[i]=1;
  if(reach.length<N*0.27)return null;
  const wallN=(x,z)=>{let c=0;for(const[dx,dz]of D8)c+=g[I(x+dx,z+dz)];return c;};
  // Start point. Level 1 always starts at the cave mouth on the top edge (entry only).
  let start,mouth=null;
  if(depth===1){let bx=-1,bz=-1;
    for(let z=2;z<GH&&bz<0;z++){let bd=1e9;for(let x=2;x<GW-2;x++)if(!g[I(x,z)]){const d=Math.abs(x-GW/2);if(d<bd){bd=d;bx=x;bz=z;}}}
    for(let z=1;z<bz;z++)g[I(bx,z)]=0;g[I(bx,1)]=0;
    mouth={cx:bx,cz:1,x:wc(bx),z:wc(1)};start={cx:bx,cz:2};
  }else{const c=[];for(const i of reach){const x=i%GW,z=(i/GW)|0;if(wallN(x,z)<=1&&(!boss||Math.hypot(x-boss.cx,z-boss.cz)>16))c.push(i);}
    if(!c.length)return null;const i=c[Math.floor(rng()*c.length)];start={cx:i%GW,cz:(i/GW)|0};}
  const bfs=srcs=>{const d=new Int16Array(N).fill(-1),q=[];for(const s of srcs){d[s]=0;q.push(s);}
    for(let h=0;h<q.length;h++){const c=q[h],x=c%GW,z=(c/GW)|0;
      for(const[dx,dz]of D4){const nx=x+dx,nz=z+dz;if(nx<0||nz<0||nx>=GW||nz>=GH)continue;const j=I(nx,nz);if(!g[j]&&d[j]<0){d[j]=d[c]+1;q.push(j);}}}
    return d;};
  const dist=bfs([I(start.cx,start.cz)]);let maxD=0;const open=[];
  for(let i=0;i<N;i++)if(dist[i]>=0){open.push(i);if(dist[i]>maxD)maxD=dist[i];}
  if(maxD<30)return null;
  const used=new Set([I(start.cx,start.cz)]);if(mouth)used.add(I(mouth.cx,mouth.cz));
  // Descent point: far from the arrival point.
  let descent=null;
  if(depth<MAX_DEPTH){const c=open.filter(i=>dist[i]>=maxD*0.7&&wallN(i%GW,(i/GW)|0)<=4);if(!c.length)return null;
    const i=c[Math.floor(rng()*c.length)];descent={cx:i%GW,cz:(i/GW)|0,x:wc(i%GW),z:wc((i/GW)|0),found:false};used.add(i);}
  // Exit shafts: never near the arrival point, favouring dead ends and far chambers; fewer on deeper levels.
  const nEx=[3,2,2,1][depth-1]-(depth===1&&rng()<0.3?1:0);
  const cand=[];
  for(const i of open){if(dist[i]<maxD*0.35||used.has(i))continue;const x=i%GW,z=(i/GW)|0;
    if(descent&&Math.max(Math.abs(x-descent.cx),Math.abs(z-descent.cz))<6)continue;
    if(boss&&Math.hypot(x-boss.cx,z-boss.cz)<10)continue;
    const wn=wallN(x,z);if(wn<3)continue;cand.push({i,x,z,sc:wn+rng()*2+dist[i]/maxD*2});}
  cand.sort((a,b)=>b.sc-a.sc);
  const exits=[];
  for(const gap of[14,8,0]){for(const c of cand){if(exits.length>=nEx)break;
      if(exits.every(e=>Math.hypot(e.cx-c.x,e.cz-c.z)>=gap&&e.i!==c.i))exits.push({i:c.i,cx:c.x,cz:c.z,x:wc(c.x),z:wc(c.z),found:false,kind:['ladder','rope','roots'][Math.floor(rng()*3)]});}
    if(exits.length>=nEx)break;}
  if(!exits.length)return null;
  for(const e of exits)used.add(e.i);
  const exitDist=bfs(exits.map(e=>e.i));
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const inBoss=(x,z)=>boss&&Math.hypot(x-boss.cx,z-boss.cz)<7.5;
  // Resource nodes hug the walls; nothing close to the entrance.
  const nodes=[];
  for(const i of shuffle(open.filter(i=>dist[i]>6&&!used.has(i)))){if(nodes.length>=14+depth*2)break;const x=i%GW,z=(i/GW)|0;if(inBoss(x,z))continue;
    let dir=null;for(const d of D4)if(g[I(x+d[0],z+d[1])]){dir=d;break;}if(!dir)continue;
    used.add(i);nodes.push({type:wpick(rng,NODE_W[depth-1]),x:wc(x)+dir[0]*0.85,z:wc(z)+dir[1]*0.85,done:false});}
  const chests=[];
  for(const i of shuffle(open.filter(i=>dist[i]>maxD*0.5&&!used.has(i)&&wallN(i%GW,(i/GW)|0)>=2))){if(chests.length>=2+(depth>2?1:0))break;
    if(inBoss(i%GW,(i/GW)|0))continue;used.add(i);chests.push({x:wc(i%GW),z:wc((i/GW)|0),done:false});}
  const spawns=[];let ns=0;
  for(const i of shuffle(open.filter(i=>dist[i]>9&&!used.has(i)))){if(ns>=9+depth*3)break;const x=i%GW,z=(i/GW)|0;if(inBoss(x,z))continue;
    const t=wpick(rng,SPAWN_W[depth-1]);ns++;
    if(t==='swarm')for(let k=0;k<4;k++)spawns.push({type:t,x:wc(x)+(rng()-0.5),z:wc(z)+(rng()-0.5)});
    else spawns.push({type:t,x:wc(x),z:wc(z)});}
  if(boss)spawns.push({type:'boss',x:boss.x,z:boss.z});
  // The Bellman stalks every level from depth 2, starting far from the arrival point.
  if(depth>=2){const c=open.filter(i=>dist[i]>=maxD*0.6&&!used.has(i)&&!(boss&&Math.hypot(i%GW-boss.cx,((i/GW)|0)-boss.cz)<10));
    if(c.length){const i=c[Math.floor(rng()*c.length)];spawns.push({type:'bellman',x:wc(i%GW),z:wc((i/GW)|0)});}}
  // Cosmetic clutter.
  const mites=[],tites=[],glows=[];
  for(const i of open){const x=i%GW,z=(i/GW)|0,wn=wallN(x,z);
    if(wn>=2&&rng()<0.4){let d=D8[0];for(const q of D8)if(g[I(x+q[0],z+q[1])]){d=q;break;}
      mites.push({x:wc(x)+d[0]*1.15+(rng()-0.5)*0.4,z:wc(z)+d[1]*1.15+(rng()-0.5)*0.4,h:0.5+rng()*1.3,r:0.18+rng()*0.25});}
    if(rng()<0.35)tites.push({x:wc(x)+(rng()-0.5)*2.4,z:wc(z)+(rng()-0.5)*2.4,h:0.5+rng()*1.6,r:0.15+rng()*0.25});
    if(wn>=3&&rng()<0.035)glows.push({x:wc(x)+(rng()-0.5)*2,z:wc(z)+(rng()-0.5)*2,c:depth>2?0:1});}
  return{seed,depth,g,start,mouth,descent,exits,exitDist,nodes,chests,spawns,boss,mites,tites,glows,explored:new Uint8Array(N),openCount:reach.length,open};
}

   WORLD QUERIES (grid collision, heights, line of sight)
   ===================================================================== */
let L=null;
const isWallC=(cx,cz)=>cx<0||cz<0||cx>=GW||cz>=GH||L.g[cz*GW+cx]===1;
const isWallAt=(x,z)=>isWallC(Math.floor(x/CS),Math.floor(z/CS));
const cellI=(x,z)=>Math.floor(z/CS)*GW+Math.floor(x/CS);
function floorHs(x,z,s){return(vnoise(x*0.18,z*0.18,s)-0.5)*0.9+(vnoise(x*0.6,z*0.6,s+7)-0.5)*0.25;}
function ceilHs(x,z,s,boss){let h=4.6+vnoise(x*0.12,z*0.12,s+3)*2.4+(vnoise(x*0.5,z*0.5,s+9)-0.5)*0.6;
  if(boss){const d=Math.hypot(x-boss.x,z-boss.z)/(8*CS);if(d<1)h+=3*(1-d*d);}return h;}
const floorH=(x,z)=>floorHs(x,z,L.seed),ceilH=(x,z)=>ceilHs(x,z,L.seed,L.boss);
function blocked(x,z,r){const x0=Math.floor((x-r)/CS),x1=Math.floor((x+r)/CS),z0=Math.floor((z-r)/CS),z1=Math.floor((z+r)/CS);
  for(let cz=z0;cz<=z1;cz++)for(let cx=x0;cx<=x1;cx++)if(isWallC(cx,cz)){
    const nx=clamp(x,cx*CS,(cx+1)*CS),nz=clamp(z,cz*CS,(cz+1)*CS);if((x-nx)*(x-nx)+(z-nz)*(z-nz)<r*r)return true;}
  return false;}
function moveCircle(o,dx,dz,r){if(!blocked(o.x+dx,o.z,r))o.x+=dx;if(!blocked(o.x,o.z+dz,r))o.z+=dz;}
function los(x0,z0,x1,z1){const d=Math.hypot(x1-x0,z1-z0),n=Math.ceil(d/0.7);for(let i=1;i<n;i++){const t=i/n;if(isWallAt(lerp(x0,x1,t),lerp(z0,z1,t)))return false;}return true;}

/* =====================================================================
   MESH BUILDING
   Turns the grid into 3D rock: floor + ceiling height fields and wall
   sheets on every open/rock edge, all displaced by position-based noise
   so neighbouring pieces line up. Static geometry is merged per chunk
   (a few meshes total) so the GPU can frustum-cull whole chunks.
   ===================================================================== */
function buildLevel(lv){
  const grp=new THREE.Group(),s=lv.seed,pal=PALETTE[lv.depth-1],CH=11,bufs=new Map();
  const wall=(cx,cz)=>cx<0||cz<0||cx>=GW||cz>=GH||lv.g[cz*GW+cx]===1;
  const buf=(cx,cz)=>{const k=Math.floor(cx/CH)+'_'+Math.floor(cz/CH);let b=bufs.get(k);if(!b){b={p:[],c:[]};bufs.set(k,b);}return b;};
  const col=(b,x,y,z,shade)=>{const k=shade*(0.62+0.55*vnoise(x*0.35+y*0.3,z*0.35+y*0.2,s+20)+0.12*h2(Math.floor(x*7),Math.floor(z*7+y*5),s));
    for(let i=0;i<3;i++)b.c.push(pal[0]*k,pal[1]*k,pal[2]*k);};
  // Add a triangle, flipping it if needed so it faces direction (fx,fy,fz).
  const tri=(b,A,B,C,fx,fy,fz,shade)=>{const ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;if(nx*fx+ny*fy+nz*fz<0){const t=B;B=C;C=t;}
    b.p.push(A[0],A[1],A[2],B[0],B[1],B[2],C[0],C[1],C[2]);col(b,(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3,(A[2]+B[2]+C[2])/3,shade);};
  const exitSet=new Set(lv.exits.map(e=>e.i));
  const disp=(x,y,z)=>[x+(vnoise(x*0.45+y*0.37,z*0.45+17.3,s+1)-0.5)*0.8,y,z+(vnoise(x*0.45+31.7,z*0.45+y*0.37,s+2)-0.5)*0.8];
  for(let cz=0;cz<GH;cz++)for(let cx=0;cx<GW;cx++){
    const open=!wall(cx,cz);let near=open;
    if(!near)for(const[dx,dz]of D8)if(!wall(cx+dx,cz+dz)){near=true;break;}
    if(!near)continue;
    const b=buf(cx,cz),hole=exitSet.has(cz*GW+cx);
    // Floor and ceiling (2x2 quads per cell, also under the rim of walls so no gaps show).
    for(let sz=0;sz<2;sz++)for(let sx=0;sx<2;sx++){
      const x0=cx*CS+sx*CS/2,x1=x0+CS/2,z0=cz*CS+sz*CS/2,z1=z0+CS/2;
      const F=(x,z)=>[x,floorHs(x,z,s),z],Cc=(x,z)=>[x,ceilHs(x,z,s,lv.boss),z];
      tri(b,F(x0,z0),F(x0,z1),F(x1,z0),0,1,0,0.8);tri(b,F(x1,z0),F(x0,z1),F(x1,z1),0,1,0,0.8);
      if(!hole){tri(b,Cc(x0,z0),Cc(x1,z0),Cc(x0,z1),0,-1,0,0.6);tri(b,Cc(x1,z0),Cc(x1,z1),Cc(x0,z1),0,-1,0,0.6);}}
    if(!open)continue;
    // Wall sheets on each side that touches rock.
    for(const[dx,dz]of D4){if(!wall(cx+dx,cz+dz))continue;
      if(lv.mouth&&cx===lv.mouth.cx&&cz===1&&dz===-1)continue; // the mouth opening
      let ax,az,bx,bz;
      if(dx){ax=bx=(dx>0?cx+1:cx)*CS;az=cz*CS;bz=(cz+1)*CS;}else{az=bz=(dz>0?cz+1:cz)*CS;ax=cx*CS;bx=(cx+1)*CS;}
      const NH=2,NV=6,V=(i,j)=>disp(lerp(ax,bx,i/NH),-1+j*2,lerp(az,bz,i/NH));
      for(let i=0;i<NH;i++)for(let j=0;j<NV;j++){const a=V(i,j),c=V(i+1,j),d=V(i,j+1),e=V(i+1,j+1);
        tri(b,a,c,d,-dx,0,-dz,1);tri(b,c,e,d,-dx,0,-dz,1);}}
  }
  // Stalagmites / stalactites merged into the same rock buffers.
  const cone=(o,up,shade)=>{const b=buf(Math.floor(o.x/CS),Math.floor(o.z/CS)),base=up?floorHs(o.x,o.z,s)-0.1:ceilHs(o.x,o.z,s,lv.boss)+0.1;
    for(let i=0;i<conePos.length;i+=9){for(let k=0;k<9;k+=3){const x=conePos[i+k]*o.r*2,y=(conePos[i+k+1]+0.5)*o.h,z=conePos[i+k+2]*o.r*2;
        if(up)b.p.push(o.x+x,base+y,o.z+z);else b.p.push(o.x+x,base-y,o.z-z);}
      col(b,o.x,base,o.z,shade);}};
  for(const m of lv.mites)cone(m,true,0.9);
  for(const t of lv.tites)if(!exitSet.has(cellFor(t.x,t.z)))cone(t,false,0.7);
  for(const b of bufs.values()){const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(b.p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(b.c,3));

   Each character is assets/<file>.glb: a skinned mesh on the shared skeleton with
   every animation clip inside. Files load in the background; until one arrives (or

   MODEL_DEFS maps a game type to [file, height in metres the model is scaled to].

const MODEL_DEFS={player:['player',1.9],crawler:['enemy_feral',1.75],swarm:['enemy_miner',1.7],spitter:['enemy_druid',1.9],

      if(tryBuffered())break;
      if(pressed.interact&&interactT){doInteract(interactT);break;}
      p.blocking=input.block&&p.stam>0;sp=p.blocking?2.4:5.2;
      if(lockT)p.facing+=wrapA(Math.atan2(lockT.x-p.x,lockT.z-p.z)-p.facing)*Math.min(1,dt*14);
      else if(mag>0.1)p.facing+=wrapA(Math.atan2(wx,wz)-p.facing)*Math.min(1,dt*14);
      break;
    case'attack':{const a=p.atk;a.t+=dt;
      if(a.t>a.wu*0.5&&a.t<a.wu+a.ac)moveCircle(p,Math.sin(p.facing)*(a.heavy?4:3)*dt,Math.cos(p.facing)*(a.heavy?4:3)*dt,0.5);
      if(!a.hit&&a.t>=a.wu){a.hit=true;sfx('swing');playerHit();}
      if(a.t>=a.wu+a.ac+a.rc*0.6&&tryBuffered())break;
      if(a.t>=a.wu+a.ac+a.rc){p.state='idle';p.atk=null;}break;}
    case'roll':{const r=p.roll;r.t+=dt;const k=1-0.6*(r.t/r.dur);moveCircle(p,r.dx*r.sp*k*dt,r.dz*r.sp*k*dt,0.5);if(r.t>=r.dur){p.state='idle';p.roll=null;}break;}
    case'flask':p.t+=dt;sp=1.5;if(!p.healed&&p.t>0.6){p.healed=true;p.flasks--;p.hp=Math.min(p.maxHp,p.hp+p.maxHp*(0.45+0.12*save.upg.potency));sfx('drink');}if(p.t>1.1)p.state='idle';break;
    case'channel':{const c=p.chan;c.t+=dt;if(pressed.roll||pressed.light||mag>0.7){p.state='idle';p.chan=null;break;}
      if(c.t>=c.dur){p.state='idle';p.chan=null;c.done();}break;}
    case'stagger':p.t-=dt;if(p.t<=0)p.state='idle';break;
  }
  if(sp>0&&mag>0.05){moveCircle(p,wx*sp*dt,wz*sp*dt,0.5);p.walk+=dt*sp*mag;}
  // Running footsteps carry; sneaking (C / light stick push), blocking and walking are quiet.
  p.noiseT=(p.noiseT||0)-dt;if(sp>3&&mag>0.6&&p.noiseT<=0){p.noiseT=0.5;makeNoise(p.x,p.z,9);}
  // Stamina regeneration.
  p.stamDelay-=dt;const acting=p.state==='attack'||p.state==='roll';
  if(p.stamDelay<=0&&!acting)p.stam=Math.min(100,p.stam+34*(p.blocking?0.35:1)*(heavyLoad?0.8:1)*dt);
  // Keep out of enemies (except while rolling).
  if(p.state!=='roll')for(const e of enemies){if(!e.alive||e.d.fly)continue;const dx=p.x-e.x,dz=p.z-e.z,d=Math.hypot(dx,dz),m=0.45+e.r;
    if(d<m&&d>0.001)moveCircle(p,dx/d*(m-d),dz/d*(m-d),0.5);}
  p.y=floorH(p.x,p.z);
  if(pressed.lock)toggleLock();
  if(lockT&&(!lockT.alive||Math.hypot(lockT.x-p.x,lockT.z-p.z)>26))lockT=null;
}

/* =====================================================================
   LOCK-ON
   ===================================================================== */
function lockCandidates(){const p=player,out=[];for(const e of enemies){if(!e.alive)continue;const d=Math.hypot(e.x-p.x,e.z-p.z);if(d>20||!los(p.x,p.z,e.x,e.z))continue;
    out.push({e,d,a:wrapA(Math.atan2(e.x-p.x,e.z-p.z)-cam.yaw)});}return out;}
function toggleLock(){if(lockT){lockT=null;return;}let best=null,bs=1e9;for(const c of lockCandidates()){if(Math.abs(c.a)>1.3)continue;const s=Math.abs(c.a)*8+c.d;if(s<bs){bs=s;best=c.e;}}
  if(best)lockT=best;else toast('No target');}
function switchTarget(dir){if(!lockT||state!=='run')return;let best=null,ba=1e9;
  // Positive angle = to the left of the camera; dir +1 means "next target to the right".
  for(const c of lockCandidates()){if(c.e===lockT)continue;const a=-c.a*dir;if(a>0.02&&a<ba){ba=a;best=c.e;}}if(best)lockT=best;}

/* =====================================================================
   ENEMY AI: idle -> patrol -> chase -> windup -> active -> recover,
   plus stagger. Chasing uses line of sight when available and otherwise
   follows a breadth-first flow field computed from the player's cell.
   ===================================================================== */
function spawnEnemies(){enemies=[];const sc=1+0.15*(L.depth-1),dm=1+0.12*(L.depth-1);
  for(const s of L.spawns){const d=ENEMIES[s.type],model=buildEnemyModel(s.type),boss=s.type==='boss';
    const bar=new THREE.Group();bar.add(mk(GEO.plane,MAT.barBg,0,0,0,1.1,0.1,1));const fg=mk(GEO.plane,MAT.barFg,0,0,0.01,1.06,0.07,1);bar.add(fg);bar.visible=false;
    levelGroup.add(model.g);levelGroup.add(bar);
    const hp=Math.round(d.hp*(boss?1:sc));
    enemies.push({type:s.type,d,x:s.x,z:s.z,y:0,facing:Math.random()*6.28,hp,maxHp:hp,dm:boss?1:dm,r:d.r,state:'idle',t:Math.random()*2,cd:0,poise:d.poise,flash:0,alive:true,deathT:0,
      home:{x:s.x,z:s.z},model,bar,fg,see:false,losT:Math.random()*0.3,ph:Math.random()*6,atk:null,wu:1,phase2:false,hitDone:false,
      field:s.type==='bellman'?new Int16Array(GW*GH):null,tx:s.x,tz:s.z,stepAcc:0,swing:0,walkPh:0,lost:0,lx:s.x,lz:s.z,alerted:false,shakeT:0,clear:false,tollT:s.type==='bellman'?2.5:0});}
  bellRef=enemies.find(e=>e.type==='bellman')||null;if(bellRef){bellRef.state='listen';bellRef.t=1.5;}
  if(bellLP&&actx)bellLP.frequency.setValueAtTime(7000,actx.currentTime);}
function computePdist(){const N=GW*GH;if(!pdist)pdist=new Int16Array(N);pdist.fill(-1);const s=cellI(player.x,player.z);if(s<0||s>=N||L.g[s])return;const q=[s];pdist[s]=0;
  for(let h=0;h<q.length;h++){const c=q[h];if(pdist[c]>=45)continue;const x=c%GW,z=(c/GW)|0;
    for(const[dx,dz]of D4){const j=(z+dz)*GW+x+dx;if(!L.g[j]&&pdist[j]<0){pdist[j]=pdist[c]+1;q.push(j);}}}}
function flowStep(x,z){return flowOn(pdist,x,z);}
function flowOn(f,x,z){const cx=Math.floor(x/CS),cz=Math.floor(z/CS),d0=f[cz*GW+cx];if(d0<0)return null;let bx=cx,bz=cz,bd=d0;
  for(const[dx,dz]of D4){const d=f[(cz+dz)*GW+cx+dx];if(d>=0&&d<bd){bd=d;bx=cx+dx;bz=cz+dz;}}
  const tx=(bx+0.5)*CS-x,tz=(bz+0.5)*CS-z,m=Math.hypot(tx,tz);return m<0.01?null:[tx/m,tz/m];}
function pickAttack(e,gap){const o=e.d.attacks.filter(a=>gap<=a.range*(a.kind==='melee'&&!a.minRange?0.85:1)&&gap>=(a.minRange||0)&&(!a.p2||e.phase2));return o.length?o[Math.floor(Math.random()*o.length)]:null;}
function startEnemyAttack(e,a){e.atk=a;e.state='windup';e.t=e.wu=a.windup*(e.phase2?0.8:1);
  if(a.kind==='slam'){e.sx=player.x;e.sz=player.z;showRing(e,e.sx,e.sz,a.radius,e.t);}
  if(e.type==='boss')sfx('tele');}
function onActive(e){const a=e.atk,p=player,dmg=a.dmg*e.dm;
  if(a.kind==='shoot')fireProj(e.x,e.y+1.1,e.z,Math.atan2(p.x-e.x,p.z-e.z),a.pspeed,dmg);
  else if(a.kind==='volley'){for(let k=0;k<10;k++)fireProj(e.x,e.y+1.3,e.z,e.facing+k*0.628,a.pspeed,dmg);for(const o of[-0.2,0,0.2])fireProj(e.x,e.y+1.3,e.z,Math.atan2(p.x-e.x,p.z-e.z)+o,a.pspeed*1.3,dmg);}
  else if(a.kind==='slam'){hideRing(e);sfx('slam');cam.shake=Math.max(cam.shake,0.5);if(Math.hypot(p.x-e.sx,p.z-e.sz)<a.radius)damagePlayer(dmg,e.sx,e.sz,true);}
  else if(a.kind==='melee')sfx('swing');}
function updateEnemy(e,dt){
  if(e.type==='bellman')return updateBellman(e,dt);
  if(!e.alive){if(e.deathT>0){e.deathT-=dt;if(e.deathT<=0)e.model.g.visible=false;}return;}
  const p=player,d=e.d,dx=p.x-e.x,dz=p.z-e.z,dist=Math.hypot(dx,dz);
  if(dist>55&&e.state!=='chase')return;
  e.flash=Math.max(0,e.flash-dt);e.cd=Math.max(0,e.cd-dt);
  e.losT-=dt;if(e.losT<=0){e.losT=0.25;e.see=dist<32&&los(e.x,e.z,p.x,p.z);}
  const toP=Math.atan2(dx,dz),turn=rate=>{e.facing+=clamp(wrapA(toP-e.facing),-rate*dt,rate*dt);};
  const sp=d.speed*(e.phase2?1.3:1),gap=dist-e.r;
  switch(e.state){
    case'idle':case'patrol':
      if(p.state!=='dead'&&((dist<d.aggro&&e.see)||dist<3.5)){e.state='chase';if(e.type==='boss'){bossRef=e;toast('The Ossuary King awakens');}break;}
      if(e.state==='idle'){e.t-=dt;if(e.t<=0){const a=Math.random()*6.28,r=1.5+Math.random()*4;e.tx=e.home.x+Math.sin(a)*r;e.tz=e.home.z+Math.cos(a)*r;e.state='patrol';e.t=3;}}
      else{const ax=e.tx-e.x,az=e.tz-e.z,ad=Math.hypot(ax,az);e.t-=dt;
        if(ad<0.4||e.t<=0){e.state='idle';e.t=1+Math.random()*3;}else{e.facing=Math.atan2(ax,az);moveCircle(e,ax/ad*sp*0.35*dt,az/ad*sp*0.35*dt,e.r);}}
      break;
    case'chase':{
      if(p.state==='dead'||(dist>d.aggro*2.6&&e.type!=='boss')){e.state='idle';e.t=1;break;}
      turn(6);
      if(e.cd<=0&&(e.see||dist<3)){const a=pickAttack(e,gap);if(a){startEnemyAttack(e,a);break;}}
      let mx=0,mz=0;
      if(d.keep&&e.see&&dist<d.keep){mx=-dx/dist;mz=-dz/dist;}
      else if(d.keep&&e.see&&dist<d.keep+3){}
      else if(e.see){if(gap>0.9){mx=dx/dist;mz=dz/dist;}}
      else{const s=flowStep(e.x,e.z);if(s){mx=s[0];mz=s[1];}else if(e.type!=='boss'){e.state='idle';e.t=1;}}
      moveCircle(e,mx*sp*dt,mz*sp*dt,e.r);break;}
    case'windup':e.t-=dt;if(e.t>0.15)turn(e.atk.track||3);
      if(e.t<=0){e.state='active';e.t=e.atk.active;e.hitDone=false;onActive(e);}break;
    case'active':{e.t-=dt;const a=e.atk;
      if(a.kind==='melee'){if(a.lunge)moveCircle(e,Math.sin(e.facing)*a.lunge*dt,Math.cos(e.facing)*a.lunge*dt,e.r);
        if(!e.hitDone&&gap<=a.range+0.2&&Math.abs(wrapA(toP-e.facing))<THREE.MathUtils.degToRad(a.arc)/2&&damagePlayer(a.dmg*e.dm,e.x,e.z))e.hitDone=true;}
      else if(a.kind==='charge'){const ox=e.x,oz=e.z;moveCircle(e,Math.sin(e.facing)*a.lunge*dt,Math.cos(e.facing)*a.lunge*dt,e.r);
        if(Math.hypot(e.x-ox,e.z-oz)<a.lunge*dt*0.3){e.t=0;cam.shake=Math.max(cam.shake,0.4);sfx('slam');}
        if(!e.hitDone&&gap<0.8&&damagePlayer(a.dmg*e.dm,e.x,e.z))e.hitDone=true;}
      if(e.t<=0){e.state='recover';e.t=a.recover;}break;}
    case'recover':e.t-=dt;if(e.t<=0){e.state='chase';e.cd=e.atk.cd||0.5;}break;
    case'stagger':e.t-=dt;if(e.t<=0){e.state='chase';e.poise=d.poise;}break;
  }
  e.y=floorH(e.x,e.z);
}
function separateEnemies(){for(let i=0;i<enemies.length;i++){const a=enemies[i];if(!a.alive)continue;
  for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(!b.alive)continue;const dx=b.x-a.x,dz=b.z-a.z,m=a.r+b.r;if(Math.abs(dx)>m||Math.abs(dz)>m)continue;
    const d=Math.hypot(dx,dz);if(d<m&&d>0.001){const k=(m-d)/d*0.5;moveCircle(a,-dx*k,-dz*k,a.r);moveCircle(b,dx*k,dz*k,b.r);}}}}

/* =====================================================================
   THE BELLMAN: an unkillable stalker. It wanders between chambers, hunts
   noises (mining, fighting, running, rolling), and chases on sight. Its bell
   rings with every step as positional audio that is muffled through rock,
   and it goes silent while it stands and listens. Its grab is fatal, but the
   bell shakes during a long wind-up and a roll through it escapes.
   ===================================================================== */
const inArena=(x,z)=>!!L.boss&&Math.hypot(x-L.boss.x,z-L.boss.z)<7*CS;
function fieldTo(e,x,z){const f=e.field,s=cellI(x,z);if(s<0||s>=GW*GH||L.g[s])return false;f.fill(-1);const q=[s];f[s]=0;
  for(let h=0;h<q.length;h++){const c=q[h],cx=c%GW,cz=(c/GW)|0;for(const[dx,dz]of D4){const j=(cz+dz)*GW+cx+dx;if(!L.g[j]&&f[j]<0){f[j]=f[c]+1;q.push(j);}}}
  e.tx=x;e.tz=z;return true;}
function makeNoise(x,z,rad){const e=bellRef;if(!e||state!=='run'||inArena(x,z))return;
  if(e.state!=='wander'&&e.state!=='listen'&&e.state!=='hunt')return;
  if(Math.hypot(e.x-x,e.z-z)>rad)return;if(fieldTo(e,x,z)){e.state='hunt';e.t=45;}}
function bellWalk(e,dir,speed,dt){if(!dir)return;const ox=e.x,oz=e.z;e.facing+=clamp(wrapA(Math.atan2(dir[0],dir[1])-e.facing),-3.5*dt,3.5*dt);
  moveCircle(e,dir[0]*speed*dt,dir[1]*speed*dt,e.r);if(inArena(e.x,e.z)){e.x=ox;e.z=oz;}}
function towardTarget(e){const dx=e.tx-e.x,dz=e.tz-e.z,d=Math.hypot(dx,dz);if(d<0.6)return null;if(d<2.5)return[dx/d,dz/d];return flowOn(e.field,e.x,e.z)||[dx/d,dz/d];}
function pickWander(e){for(let k=0;k<30;k++){const i=L.open[Math.floor(Math.random()*L.open.length)],x=(i%GW+0.5)*CS,z=(((i/GW)|0)+0.5)*CS;
    if(inArena(x,z)||Math.hypot(x-e.x,z-e.z)<25)continue;if(fieldTo(e,x,z)){e.state='wander';e.t=40;return;}}
  e.state='listen';e.t=2;}
function updateBellman(e,dt){
  const p=player,dx=p.x-e.x,dz=p.z-e.z,dist=Math.hypot(dx,dz)||0.001,ox=e.x,oz=e.z,toP=Math.atan2(dx,dz);
  if(e.tollT>0){e.tollT-=dt;if(e.tollT<=0){bellStrike(e.x,e.z,5,7,0.5);toast('Somewhere in the dark, a bell tolls…');}}
  e.cd=Math.max(0,e.cd-dt);e.flash=Math.max(0,e.flash-dt);
  e.losT-=dt;if(e.losT<=0){e.losT=0.2;const clear=dist<70&&los(e.x,e.z,p.x,p.z);e.clear=clear;
    e.see=p.state!=='dead'&&clear&&dist<22&&!inArena(p.x,p.z)&&(dist<6||Math.abs(wrapA(toP-e.facing))<1.2);
    if(bellLP&&actx)bellLP.frequency.setTargetAtTime(clear?7000:650,actx.currentTime,0.2);}
  const calm=e.state==='wander'||e.state==='listen'||e.state==='hunt';
  if(e.see){e.lx=p.x;e.lz=p.z;e.lost=0;if(calm){e.state='chase';if(!e.alerted){e.alerted=true;toast('The bell is close. RUN.');}}}
  switch(e.state){
    case'listen':e.t-=dt;e.facing+=Math.sin(e.t*1.3)*0.6*dt;if(e.t<=0)pickWander(e);break;
    case'wander':case'hunt':{e.t-=dt;const dir=towardTarget(e);bellWalk(e,dir,e.state==='hunt'?3.6:e.d.speed,dt);
      if(!dir||e.t<=0){e.state='listen';e.t=2.5+Math.random()*2.5;}break;}
    case'chase':{
      if(p.state==='dead'||inArena(p.x,p.z)){e.state='listen';e.t=3;break;}
      if(!e.see){e.lost+=dt;if(e.lost>2.5){if(fieldTo(e,e.lx,e.lz)){e.state='hunt';e.t=20;}else{e.state='listen';e.t=3;}break;}}
      if(dist<e.r+1.7&&e.cd<=0&&Math.abs(wrapA(toP-e.facing))<0.9){e.state='windup';e.t=e.wu=0.95;e.shakeT=0;break;}
      const dir=(e.see||dist<4)?[dx/dist,dz/dist]:flowStep(e.x,e.z);
      if(dist>e.r+1.0)bellWalk(e,dir,e.d.chase,dt);else e.facing+=clamp(wrapA(toP-e.facing),-4*dt,4*dt);break;}
    case'windup':e.t-=dt;e.facing+=clamp(wrapA(toP-e.facing),-2*dt,2*dt);
      e.shakeT-=dt;if(e.shakeT<=0){e.shakeT=0.18;bellStrike(e.x,e.z,0.6,0.6,1.25);e.swing+=0.25;}
      if(e.t<=0){e.state='active';e.t=0.28;e.hitDone=false;sfx('swing');}break;
    case'active':e.t-=dt;moveCircle(e,Math.sin(e.facing)*3.5*dt,Math.cos(e.facing)*3.5*dt,e.r);
      if(!e.hitDone&&dist<e.r+2.0&&Math.abs(wrapA(toP-e.facing))<1.0&&damagePlayer(9999,e.x,e.z,true)){e.hitDone=true;if(p.state==='dead')run.killedBy='the Bellman';}
      if(e.t<=0){e.state='recover';e.t=1.3;}break;
    case'recover':e.t-=dt;if(e.t<=0){e.state=e.see?'chase':'listen';e.t=2;e.cd=0.5;e.lost=0;}break;
    case'stagger':e.t-=dt;if(e.t<=0){e.state='chase';e.lost=0;e.cd=0.6;}break;
  }
  e.y=floorH(e.x,e.z);
  const moved=Math.hypot(e.x-ox,e.z-oz);e.stepAcc+=moved;e.walkPh+=moved*2.2;
  if(e.stepAcc>1.7){e.stepAcc=0;bellStrike(e.x,e.z,e.state==='chase'?1:0.65,2.4,1);e.swing+=0.35;}
  e.swing*=Math.exp(-dt*1.5);
}

/* =====================================================================
   INTERACTION, EXPLORATION, RUN FLOW
   ===================================================================== */
function findInteract(){const p=player;let best=null,bd=2.4;const chk=(x,z,o)=>{const d=Math.hypot(x-p.x,z-p.z);if(d<bd){bd=d;best=o;}};
  for(const n of L.nodes)if(!n.done)chk(n.x,n.z,{k:'node',o:n,label:(n.type==='fungus'?'Gather ':'Mine ')+MATS[n.type].n});
  for(const c of L.chests)if(!c.done)chk(c.x,c.z,{k:'chest',o:c,label:'Open chest'});
  for(const e of L.exits)chk(e.x,e.z,{k:'exit',o:e,label:'Climb out ('+e.kind+') — extract'});
  if(L.descent)chk(L.descent.x,L.descent.z,{k:'descent',o:L.descent,label:'Descend to depth '+(L.depth+1)});
  if(L.mouth)chk(L.mouth.x,L.mouth.z,{k:'mouth',o:L.mouth,label:'Cave mouth'});
  return best;}
function doInteract(it){const p=player;
  if(it.k==='node'){const n=it.o;makeNoise(p.x,p.z,26);channel(1.4,'Mining…',()=>{makeNoise(p.x,p.z,26);n.done=true;n.mesh.visible=false;sfx('mine');giveLoot(n.type,1+Math.floor(Math.random()*3),p.x,p.z);});}
  else if(it.k==='chest'){const c=it.o;channel(0.8,'Opening…',()=>{makeNoise(p.x,p.z,18);c.done=true;c.lid.position.set(0,0.75,-0.3);c.lid.rotation.x=-1.1;sfx('pick');
    const w=NODE_W[Math.min(MAX_DEPTH-1,L.depth)];for(let k=0;k<3+Math.floor(Math.random()*3);k++)spawnPickup(Math.random()<0.5?wpick(Math.random,w):wpick(Math.random,NODE_W[L.depth-1]),1+Math.floor(Math.random()*2),c.x,c.z);
    spawnPickup(Math.random()<0.5?'bone':'hide',2,c.x,c.z);});}
  else if(it.k==='exit')channel(3,'Climbing out…',()=>endRun('extract',it.o.kind),true);
  else if(it.k==='descent')channel(1.2,'Descending…',()=>{loadLevel(L.depth+1);toast('Depth '+L.depth+' — no way back up from here');});
  else toast('The entry chute is too steep to climb. Find an exit shaft.');}
function explore(){const c=cellI(player.x,player.z);if(c===lastCell||c<0||c>=GW*GH)return;lastCell=c;const seen=new Map([[c,0]]),q=[c];
  for(let h=0;h<q.length;h++){const i=q[h],d=seen.get(i);L.explored[i]=1;const x=i%GW,z=(i/GW)|0;
    for(const[dx,dz]of D8){const j=(z+dz)*GW+x+dx;if(L.g[j]){L.explored[j]=1;continue;}if(d<5&&!seen.has(j)){seen.set(j,d+1);q.push(j);}}}
  for(const e of L.exits)if(!e.found&&L.explored[e.i]){e.found=true;toast('You feel moving air — an exit shaft is close');}

   FIXED-STEP GAME LOGIC

function step(dt){
  if(pressed.pause){pauseRun();return;}
  if(pressed.map){mapBig=!mapBig;$('map').classList.toggle('big',mapBig);mapT=0;}
  updatePlayer(dt);if(state!=='run')return;
  pdistT-=dt;if(pdistT<=0){pdistT=0.25;computePdist();}
  for(const e of enemies)updateEnemy(e,dt);separateEnemies();
  const p=player;
  for(const q of projs){if(!q.on)continue;q.x+=q.vx*dt;q.z+=q.vz*dt;q.life-=dt;
    if(q.life<=0||isWallAt(q.x,q.z)){q.on=false;q.m.visible=false;continue;}
    if(Math.hypot(q.x-p.x,q.z-p.z)<0.65&&damagePlayer(q.dmg,q.x-q.vx,q.z-q.vz)){q.on=false;q.m.visible=false;}}
  for(const r of rings)if(r.on){r.t+=dt;if(r.t>r.dur+0.3){r.on=false;r.g.visible=false;}}
  for(let i=pickups.length-1;i>=0;i--){const k=pickups[i];k.cd-=dt;if(k.cd>0||Math.hypot(k.x-p.x,k.z-p.z)>1.5||p.state==='dead')continue;
    const left=addToPack(k.mat,k.n);if(left<k.n){toast('+'+(k.n-left)+' '+MATS[k.mat].n);sfx('pick');}
    if(left<=0){levelGroup.remove(k.m);pickups.splice(i,1);}else{if(left===k.n)toast('Backpack full');k.n=left;k.cd=1.5;}}
  explore();interactT=p.state==='idle'?findInteract():null;
}

/* =====================================================================
   CAMERA: third-person, over the right shoulder. Free orbit normally;
   when locked on it swings behind the player to frame the target.
   A short ray march pulls the camera in so it never clips into rock.
   ===================================================================== */
function camBlocked(x,y,z){return blocked(x,z,0.3)||y<floorH(x,z)+0.25||y>ceilH(x,z)-0.25;}
function updateCamera(dt){
  const p=player;
  if(lockT){cam.yaw+=wrapA(Math.atan2(lockT.x-p.x,lockT.z-p.z)-cam.yaw)*Math.min(1,dt*6);cam.pitch=lerp(cam.pitch,0.3,Math.min(1,dt*3));}
  else{cam.yaw=wrapA(cam.yaw-input.lookX);cam.pitch=clamp(cam.pitch+input.lookY,-0.4,1.15);}
  input.lookX=input.lookY=0;
  const fx=Math.sin(cam.yaw),fz=Math.cos(cam.yaw),rx=-fz,rz=fx;
  let off=0.55;if(blocked(p.x+rx*off,p.z+rz*off,0.3))off=0;
  const tx=p.x+rx*off,ty=p.y+1.6+(p.chan&&p.chan.climb?p.chan.t/p.chan.dur*2.5:0),tz=p.z+rz*off;
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),dx=-fx*cp,dy=sp,dz=-fz*cp;
  let free=cam.dist;for(let d=0.3;d<=cam.dist;d+=0.2)if(camBlocked(tx+dx*d,ty+dy*d,tz+dz*d)){free=Math.max(0.35,d-0.3);break;}
  cam.cur=free<cam.cur?free:lerp(cam.cur,free,Math.min(1,dt*5));
  cam.shake=Math.max(0,cam.shake-dt*1.8);const s=cam.shake*0.35;
  camera.position.set(tx+dx*cam.cur+(Math.random()-0.5)*s,ty+dy*cam.cur+(Math.random()-0.5)*s,tz+dz*cam.cur+(Math.random()-0.5)*s);
  camera.lookAt(tx-dx*10,ty-dy*10,tz-dz*10);
}

/* =====================================================================
   CAMP: 3D backdrop + crafting / gear / stash menus
   ===================================================================== */
const campScene=new THREE.Scene();campScene.background=new THREE.Color(0x070a14);campScene.fog=new THREE.Fog(0x070a14,14,60);
campCam=new THREE.PerspectiveCamera(55,1,0.1,120);
let fireLight,flames=[];
(function buildCamp(){
  campScene.add(new THREE.HemisphereLight(0x3a4a70,0x1a1410,1.6));
  const gr=mk(GEO.disc,lam(0x2a2a20),0,0,0,60);gr.rotation.x=-Math.PI/2;campScene.add(gr);
  fireLight=new THREE.PointLight(0xff8a3a,70,34,1.5);fireLight.position.set(0,1.4,0);campScene.add(fireLight);
  for(let k=0;k<5;k++){const l=mk(GEO.box,MAT.wood,Math.sin(k*1.26)*0.35,0.12,Math.cos(k*1.26)*0.35,0.14,0.14,0.9);l.rotation.y=k*1.26;campScene.add(l);}
  for(let k=0;k<3;k++){const f=mk(GEO.cone,new THREE.MeshBasicMaterial({color:[0xffc040,0xff7a20,0xffe890][k]}),(k-1)*0.14,0.5,(k%2)*0.1,0.4-k*0.08,0.9,0.4-k*0.08);flames.push(f);campScene.add(f);}
  const rock=lam(0x4a4640);
  for(let k=0;k<9;k++){const a=k/8*Math.PI,r=mk(GEO.dode,rock,Math.cos(a)*5.5,Math.sin(a)*5+0.5,-11,4.2+Math.sin(k*3)*0.8);r.rotation.set(k,k*2,k*3);campScene.add(r);}
  campScene.add(mk(GEO.disc,new THREE.MeshBasicMaterial({color:0x000000}),0,2.4,-9.4,4.6));
  for(let k=0;k<14;k++){const a=k*2.4,d=14+(k%5)*5;campScene.add(mk(GEO.dode,rock,Math.sin(a)*d,0.4,Math.cos(a)*d-4,1+(k%3)*0.8));}
  const tent=mk(new THREE.ConeGeometry(2.2,2.8,4),lam(0x6a5a44),5,1.4,1.5);tent.rotation.y=0.6;campScene.add(tent);
  campScene.add(mk(GEO.box,MAT.wood,-4.2,0.5,1.2,2.2,0.14,1));campScene.add(mk(GEO.box,MAT.wood,-5.1,0.25,1.2,0.14,0.5,0.9));campScene.add(mk(GEO.box,MAT.wood,-3.3,0.25,1.2,0.14,0.5,0.9));
  campScene.add(mk(GEO.box,lam(0x8c8c96),-4.2,0.68,1.2,0.5,0.2,0.3));
  campScene.add(mk(GEO.box,MAT.chest,-2.2,0.3,3.4,1,0.6,0.7));campScene.add(mk(GEO.box,MAT.gold,-2.2,0.63,3.4,1.04,0.1,0.74));
  const sp=new Float32Array(600);for(let i=0;i<200;i++){const a=Math.random()*6.28,e=0.15+Math.random()*1.2;sp[i*3]=Math.cos(a)*Math.cos(e)*90;sp[i*3+1]=Math.sin(e)*90;sp[i*3+2]=Math.sin(a)*Math.cos(e)*90;}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));campScene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.5,fog:false})));
})();
function renderCamp3D(t){const a=Math.sin(t*0.07)*0.5;campCam.position.set(Math.sin(a)*12,3.4,Math.cos(a)*12+2);campCam.lookAt(0,1.8,-3);
  fireLight.intensity=62+Math.sin(t*9)*8+Math.sin(t*23)*5;for(let k=0;k<3;k++){flames[k].scale.y=0.8+Math.sin(t*(8+k*3)+k)*0.25;flames[k].position.y=0.25+flames[k].scale.y*0.5;}
  renderer.render(campScene,campCam);}

let campTab='craft';const TABS=['craft','gear','stash','help'];
const afford=c=>{for(const k in c)if(c[k]>0&&(save.stash[k]||0)<c[k])return false;return true;};
const pay=c=>{for(const k in c)if(c[k]>0)save.stash[k]-=c[k];};
const costHtml=c=>Object.keys(c).filter(k=>c[k]>0).map(k=>`<span class="chip ${(save.stash[k]||0)>=c[k]?'ok':'no'}">${MATS[k].n} ${save.stash[k]||0}/${c[k]}</span>`).join('');
const rowH=(title,sub,cost,key,label,dis)=>`<div class="row"><div><b>${title}</b><small>${sub}</small>${cost?costHtml(cost):''}</div><button data-k="${key}" ${dis?'disabled':''}>${label}</button></div>`;
const wDesc=w=>`${w.type} · damage ${w.dmg} · reach ${w.range} · speed ${w.speed} · weight ${w.w}`;
const aDesc=a=>`blocks ${Math.round(a.def*100)}% damage · weight ${a.w}`;
const CONTROLS=`<b>Xbox controller</b><br>Left stick move (push lightly to sneak) · Right stick camera · RB light attack · RT heavy attack · B roll · LB block (hold) · X flask · A interact · R3 (click right stick) lock-on · flick right stick or D-pad ←/→ to switch target · View or Y map · Menu pause<br>In menus: D-pad or left stick to move, A select, B back, LB/RB change tab, Menu enters the cave<br><br>
<b>Keyboard + mouse</b><br>WASD move · mouse look · left click light · right click heavy (J/K also work) · Space roll · Shift block · hold C to sneak · Q lock-on (mouse wheel switches target) · E interact · F flask · M map · P or Esc pause<br><br>
<b>Touch</b><br>Left side: move stick · drag on the right: camera (flick while locked to switch target) · on-screen buttons · tap the prompt to interact<br><br>
<b>How it works</b><br>Enter through the cave mouth, mine and loot, then find an exit shaft: follow the drifting dust, the wind and the shaft of daylight, and climb out to keep your backpack. Die and the backpack is lost. Deeper levels have better materials and fewer exits. Light attacks bounce off a Brute's shield from the front: use heavy attacks or get behind it.<br><br>
<b>The Bellman</b><br>From depth 2, something walks the tunnels. You'll hear its bell with every step: louder means closer, and it sounds muffled when rock is between you. It can't be killed and its grab is fatal. Heavy attacks only stagger it. It hunts by sound: mining, fighting, rolling and running draw it in, while sneaking and walking are quiet. When the bell shakes, roll. When the bell goes silent, it is standing still and listening. Break line of sight and use the maze's loops to lose it. It won't follow you into the final boss's cavern.`;
function renderCamp(){
  const s=save;let h='';
  $('campSub').textContent=`Runs ${s.stats.runs} · Extractions ${s.stats.extracts} · Deaths ${s.stats.deaths} · Deepest ${s.stats.deepest||'-'} · Warden kills ${s.stats.boss}`;
  for(const b of document.querySelectorAll('.tabs button'))b.classList.toggle('sel',b.dataset.tab===campTab);
  $('lastSeed').disabled=!s.lastSeed;
  if(campTab==='craft'){
    h+='<h3>Upgrades</h3>';for(const id in UPGRADES){const u=UPGRADES[id],l=s.upg[id],mx=l>=u.max,c=mx?null:u.cost(l);h+=rowH(`${u.n} ${l}/${u.max}`,u.d,c,'u:'+id,mx?'MAX':'Upgrade',mx||!afford(c));}
    h+='<h3>Weapons</h3>';let n=0;for(const id in WEAPONS){const w=WEAPONS[id];if(!w.cost||s.owned.w.includes(id))continue;n++;h+=rowH(w.n,wDesc(w),w.cost,'w:'+id,'Craft',!afford(w.cost));}if(!n)h+='<small>All weapons crafted.</small>';
    h+='<h3>Armor</h3>';n=0;for(const id in ARMORS){const a=ARMORS[id];if(!a.cost||s.owned.a.includes(id))continue;n++;h+=rowH(a.n,aDesc(a),a.cost,'a:'+id,'Craft',!afford(a.cost));}if(!n)h+='<small>All armor crafted.</small>';
  }else if(campTab==='gear'){
    const lr=loadRatio();h+=`<div class="ctl" style="margin-top:8px">Equip load <b>${curW().w+curA().w}/${MAX_LOAD}</b> — ${lr>0.7?'heavy: slow rolls, slower stamina':lr<=0.35?'light: long rolls':'medium'} · Flasks <b>${maxFlasks()}</b> · Backpack <b>${packSlots()}</b> slots</div>`;
    h+='<h3>Weapons</h3>';for(const id of s.owned.w){const w=WEAPONS[id],eq=s.equip.w===id;h+=rowH(w.n,wDesc(w),null,'ew:'+id,eq?'Equipped':'Equip',eq);}
    h+='<h3>Armor</h3>';for(const id of s.owned.a){const a=ARMORS[id],eq=s.equip.a===id;h+=rowH(a.n,aDesc(a),null,'ea:'+id,eq?'Equipped':'Equip',eq);}
  }else if(campTab==='stash'){
    h+='<h3>Stash</h3><div class="grid">';let n=0;for(const k in MATS)if(s.stash[k]>0){n++;h+=`<div style="color:${MATS[k].c}">${MATS[k].n}<br><b>×${s.stash[k]}</b></div>`;}
    h+='</div>'+(n?'':'<small>Empty. Extract from the cave to bring materials home.</small>')+'<h3>Save</h3>'+rowH('Reset progress','Deletes stash, gear and upgrades',null,'reset',resetArm?'Really reset?':'Reset',false);
  }else h+='<div class="ctl" style="margin-top:8px">'+CONTROLS+'</div>';
  $('campBody').innerHTML=h;
}
let resetArm=false;
function campAct(k){const[c,id]=k.split(':'),s=save;
  if(c==='u'){const u=UPGRADES[id],cost=u.cost(s.upg[id]);if(s.upg[id]<u.max&&afford(cost)){pay(cost);s.upg[id]++;sfx('pick');}}
  else if(c==='w'){const w=WEAPONS[id];if(afford(w.cost)&&!s.owned.w.includes(id)){pay(w.cost);s.owned.w.push(id);s.equip.w=id;sfx('pick');}}
  else if(c==='a'){const a=ARMORS[id];if(afford(a.cost)&&!s.owned.a.includes(id)){pay(a.cost);s.owned.a.push(id);s.equip.a=id;sfx('pick');}}
  else if(c==='ew')s.equip.w=id;else if(c==='ea')s.equip.a=id;
  else if(c==='reset'){if(!resetArm){resetArm=true;}else{resetArm=false;save=defSave();}}
  if(c!=='reset')resetArm=false;
  writeSave();renderCamp();
  if(device==='pad'){const b=document.querySelector(`#campBody button[data-k="${k}"]:not(:disabled)`);if(b)b.focus();else menuNav(1);}}
function cycleTab(d){campTab=TABS[(TABS.indexOf(campTab)+d+TABS.length)%TABS.length];renderCamp();}
$('campBody').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b){initAudio();campAct(b.dataset.k);}});
for(const b of document.querySelectorAll('.tabs button'))b.addEventListener('click',()=>{campTab=b.dataset.tab;renderCamp();});
$('enter').addEventListener('click',()=>{if(state==='camp')startRun(parseSeed($('seedIn').value));});
$('lastSeed').addEventListener('click',()=>{$('seedIn').value=save.lastSeed;});
$('sumBtn').addEventListener('click',toCamp);
$('resume').addEventListener('click',resumeRun);
$('abandon').addEventListener('click',()=>{if(state==='pause')endRun('abandon');});
$('pauseHelp').innerHTML=CONTROLS;
addEventListener('gamepadconnected',()=>{setDevice('pad');if(state==='camp')$('enter').focus();});

/* =====================================================================
   MAIN LOOP (fixed 60 Hz logic, render every frame)
   ===================================================================== */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,(now-last)/1000),t=now/1000;last=now;
  pollGamepad(dt);gatherInput();
  if(state==='run'){acc+=dt;let n=0;
    while(acc>=STEP&&n<5&&state==='run'){if(hitStop>0)hitStop-=STEP;else{step(STEP);pressed={};}acc-=STEP;n++;}
    if(n>=5)acc=0;
    if(state==='run'||state==='summary')renderRun(dt,t);else renderer.render(scene,camera);}
  else if(state==='camp')renderCamp3D(t);
  else{pressed={};renderer.render(scene,camera);}
}
resize();renderCamp();$('touch').classList.toggle('hidden',device!=='touch');
loadModels();
requestAnimationFrame(frame);
// Small debug handle (used for automated testing; harmless in play).
window.__hd={get state(){return state;},get models(){return GLB;},get L(){return L;},get run(){return run;},get save(){return save;},get enemies(){return enemies;},get lock(){return lockT;},get bell(){return bellRef;},get bellCount(){return bellCount;},makeNoise,player,cam,press,keys,startRun,generateLevel,addToPack,damagePlayer,damageEnemy,endRun,toCamp,loadLevel};
</script>
